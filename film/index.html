          <div class="caption clip" id="caption-03" data-start="2.5333" data-duration="0.8667" data-track-index="82">水中恶蛟，</div>
          <div class="caption clip" id="caption-04" data-start="3.4667" data-duration="0.6667" data-track-index="83">还有周处。</div>
          <div class="caption clip" id="caption-05" data-start="4.2000" data-duration="1.0333" data-track-index="84">乡人劝周处</div>
          <div class="caption clip" id="caption-06" data-start="5.3000" data-duration="0.8000" data-track-index="85">除虎斩蛟，</div>

          <div class="caption clip" id="caption-08" data-start="7.7667" data-duration="1.7667" data-track-index="87">他刺虎，追蛟数十里，</div>
          <div class="caption clip" id="caption-09" data-start="9.6000" data-duration="1.2667" data-track-index="88">三日三夜未归。</div>
          <div class="caption clip" id="caption-10" data-start="10.9000" data-duration="1.4000" data-track-index="89">乡人以为他死了，</div>
          <div class="caption clip" id="caption-11" data-start="12.3333" data-duration="0.9667" data-track-index="90">竟相庆贺。</div>
          <div class="caption clip" id="caption-12" data-start="13.3333" data-duration="1.4333" data-track-index="91">周处斩蛟归来，</div>
          <div class="caption clip" id="caption-13" data-start="14.8000" data-duration="1.6000" data-track-index="92">才知自己为人所患，</div>
          <div class="caption clip" id="caption-14" data-start="16.4667" data-duration="0.8000" data-track-index="93">决意改过。</div>
          <div class="caption clip" id="caption-15" data-start="17.3333" data-duration="1.2667" data-track-index="94">他寻二陆，</div>
          <div class="caption clip" id="caption-16" data-start="18.6667" data-duration="0.8333" data-track-index="95">只见陆云，</div>
          <div class="caption clip" id="caption-17" data-start="19.5667" data-duration="1.0333" data-track-index="96">忧年已蹉跎。</div>
          <div class="caption clip" id="caption-18" data-start="20.6667" data-duration="1.8667" data-track-index="97">陆云说：人患志之不立，</div>
          <div class="caption clip" id="caption-19" data-start="22.5667" data-duration="1.2000" data-track-index="98">何忧令名不彰！</div>
          <div class="caption clip" id="caption-20" data-start="23.8333" data-duration="1.1000" data-track-index="99">周处遂改励，</div>
          <div class="caption clip" id="caption-21" data-start="24.9667" data-duration="1.6333" data-track-index="100">终为忠臣孝子。</div>

  "captions": [
    {
      "id": "C01",
      "dom_id": "caption-01",
      "start_frame": 7,
      "end_frame_exclusive": 35,
      "text": "义兴三害：",
      "lines": [
        "义兴三害："
      ],
      "line_id": "V1"
    },
    {
      "id": "C02",
      "dom_id": "caption-02",
      "start_frame": 37,
      "end_frame_exclusive": 74,
      "text": "山中邅迹虎，",
      "lines": [
        "山中邅迹虎，"
      ],
      "line_id": "V1"
    },
    {
      "id": "C03",
      "dom_id": "caption-03",
      "start_frame": 76,
      "end_frame_exclusive": 102,
      "text": "水中恶蛟，",
      "lines": [
        "水中恶蛟，"
      ],
      "line_id": "V1"
    },
    {
      "id": "C04",
      "dom_id": "caption-04",
      "start_frame": 104,
      "end_frame_exclusive": 124,
      "text": "还有周处。",
      "lines": [
        "还有周处。"
      ],
      "line_id": "V1"
    },
    {
      "id": "C05",
      "dom_id": "caption-05",
      "start_frame": 126,
      "end_frame_exclusive": 157,
      "text": "乡人劝周处",
      "lines": [
        "乡人劝周处"
      ],
      "line_id": "V2"
    },
    {
      "id": "C06",
      "dom_id": "caption-06",
      "start_frame": 159,
      "end_frame_exclusive": 183,
      "text": "除虎斩蛟，",
      "lines": [
        "除虎斩蛟，"
      ],
      "line_id": "V2"
    },
    {
      "id": "C07",
      "dom_id": "caption-07",
      "start_frame": 184,
      "end_frame_exclusive": 231,
      "text": "暗盼三害只余其一。",
      "lines": [
        "暗盼三害只余其一。"
      ],
      "line_id": "V2"
    },
    {
      "id": "C08",
      "dom_id": "caption-08",
      "start_frame": 233,
      "end_frame_exclusive": 286,
      "text": "他刺虎，追蛟数十里，",
      "lines": [
        "他刺虎，追蛟数十里，"
      ],
      "line_id": "V3"
    },
    {
      "id": "C09",
      "dom_id": "caption-09",
      "start_frame": 288,
      "end_frame_exclusive": 326,
      "text": "三日三夜未归。",
      "lines": [
        "三日三夜未归。"
      ],
      "line_id": "V3"
    },
    {
      "id": "C10",
      "dom_id": "caption-10",
      "start_frame": 327,
      "end_frame_exclusive": 369,
      "text": "乡人以为他死了，",
      "lines": [
        "乡人以为他死了，"
      ],
      "line_id": "V4"
    },
    {
      "id": "C11",
      "dom_id": "caption-11",
      "start_frame": 370,
      "end_frame_exclusive": 399,
      "text": "竟相庆贺。",
      "lines": [
        "竟相庆贺。"
      ],
      "line_id": "V4"
    },
    {
      "id": "C12",
      "dom_id": "caption-12",
      "start_frame": 400,
      "end_frame_exclusive": 443,
      "text": "周处斩蛟归来，",
      "lines": [
        "周处斩蛟归来，"
      ],
      "line_id": "V5"
    },
    {
      "id": "C13",
      "dom_id": "caption-13",
      "start_frame": 444,
      "end_frame_exclusive": 492,
      "text": "才知自己为人所患，",
      "lines": [
        "才知自己为人所患，"
      ],
      "line_id": "V5"
    },
    {
      "id": "C14",
      "dom_id": "caption-14",
      "start_frame": 494,
      "end_frame_exclusive": 518,
      "text": "决意改过。",
      "lines": [
        "决意改过。"
      ],
      "line_id": "V5"
    },
    {
      "id": "C15",
      "dom_id": "caption-15",
      "start_frame": 520,
      "end_frame_exclusive": 558,
      "text": "他寻二陆，",
      "lines": [
        "他寻二陆，"
      ],
      "line_id": "V6"
    },
    {
      "id": "C16",
      "dom_id": "caption-16",
      "start_frame": 560,
      "end_frame_exclusive": 585,
      "text": "只见陆云，",
      "lines": [
        "只见陆云，"
      ],
      "line_id": "V6"
    },
    {
      "id": "C17",
      "dom_id": "caption-17",
      "start_frame": 587,
      "end_frame_exclusive": 618,
      "text": "忧年已蹉跎。",
      "lines": [
        "忧年已蹉跎。"
      ],
      "line_id": "V6"
    },
    {
      "id": "C18",
      "dom_id": "caption-18",
      "start_frame": 620,
      "end_frame_exclusive": 676,
      "text": "陆云说：人患志之不立，",
      "lines": [
        "陆云说：人患志之不立，"
      ],
      "line_id": "V7"
    },
    {
      "id": "C19",
      "dom_id": "caption-19",
      "start_frame": 677,
      "end_frame_exclusive": 713,
      "text": "何忧令名不彰！",
      "lines": [
        "何忧令名不彰！"
      ],
      "line_id": "V7"
    },
    {
      "id": "C20",
      "dom_id": "caption-20",
      "start_frame": 715,
      "end_frame_exclusive": 748,
      "text": "周处遂改励，",
      "lines": [
        "周处遂改励，"
      ],
      "line_id": "V8"
    },
    {
      "id": "C21",
      "dom_id": "caption-21",
      "start_frame": 749,
      "end_frame_exclusive": 798,
      "text": "终为忠臣孝子。",
      "lines": [
        "终为忠臣孝子。"
      ],
      "line_id": "V8"
    }
  ],
